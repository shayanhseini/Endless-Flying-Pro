<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1424">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #080d16;
      overflow: hidden;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #080d16;
    }
    #loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #151e30 0%, #080d16 100%);
      z-index: 9999;
      pointer-events: none;
      transition: opacity 0.5s ease-out;
    }
    .logo-wrapper {
      background: #ffffff;
      padding: 16px 36px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: min(75vw, 360px);
    }
    #loading-logo {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }
    #loading-bar-wrap {
      width: min(65vw, 320px);
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
    #loading-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1abc9c, #f2c14e);
      border-radius: 3px;
      transition: width 0.15s ease-out;
      box-shadow: 0 0 8px rgba(242, 193, 78, 0.6);
    }
    #loading-text {
      margin-top: 14px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      direction: rtl;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading-container">
    <div class="logo-wrapper">
      <img id="loading-logo" src="topvision_logo.png" alt="TopVision.ir">
    </div>
    <div id="loading-bar-wrap">
      <div id="loading-bar"></div>
    </div>
    <div id="loading-text">در حال بارگذاری اطلاعات...</div>
  </div>

  <!-- DroneVision engine: starts loading the pose model while Unity loads -->
  <script type="module" src="dronevision/unity-bridge.js"></script>

  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    var bar = document.getElementById('loading-bar');
    var loadingText = document.getElementById('loading-text');
    var loadingContainer = document.getElementById('loading-container');

    // Weak GPUs: phones have 2-3x pixel density; rendering at full density costs
    // 4-9x the pixels for little visible gain. Cap DPR at 1.0 to prevent 1440p/4K overdraw on laptops/desktops
    // while guaranteeing crisp 1080p and high 60fps performance.
    var dpr = Math.min(window.devicePixelRatio || 1, 1.0);

    createUnityInstance(document.querySelector('#unity-canvas'), {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: dpr,
    }, function (p) {
      if (bar) bar.style.width = (100 * p) + '%';
      if (loadingText) loadingText.textContent = 'در حال دریافت اطلاعات... ' + Math.round(100 * p) + '%';
    })
    .then(function (instance) {
      window.unityInstance = instance;
      if (loadingContainer) {
        loadingContainer.style.opacity = '0';
        setTimeout(function() {
          if (loadingContainer.parentNode) loadingContainer.parentNode.removeChild(loadingContainer);
        }, 500);
      }
    })
    .catch(function (message) { alert(message); });
  </script>
</body>
</html>
